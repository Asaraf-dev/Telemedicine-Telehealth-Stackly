<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16865A">
    <title>404 - Page Not Found | Telemedicine & Telehealth</title>
    <!--- Bootstrap Icon --->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/404.css">
</head>

<body>
    <!--- 404 Page --->
    <main class="tt-404-page">
        <!--- Background Elements --->
        <div class="tt-404-bg">
            <span class="tt-404-orb tt-404-orb-one"></span>
            <span class="tt-404-orb tt-404-orb-two"></span>
            <span class="tt-404-circle tt-404-circle-one"></span>
            <span class="tt-404-circle tt-404-circle-two"></span>
        </div>
        <!--- 404 Content --->
        <div class="tt-404-container">
            <!--- Illustration --->
            <div class="tt-404-illustration">
                <div class="tt-404-number">4</div>
                <div class="tt-404-center">
                    <div class="tt-404-icon-circle">
                        <i class="bi bi-heart-pulse-fill"></i>
                    </div>
                    <span class="tt-404-center-dot tt-404-dot-one"></span>
                    <span class="tt-404-center-dot tt-404-dot-two"></span>
                </div>
                <div class="tt-404-number">4</div>
                <span class="tt-404-floating-icon tt-404-floating-one"><i class="bi bi-plus-lg"></i></span>
                <span class="tt-404-floating-icon tt-404-floating-two"><i class="bi bi-heart-pulse"></i></span>
                <span class="tt-404-floating-icon tt-404-floating-three"><i class="bi bi-activity"></i></span>
            </div>
            <!--- Error Text --->
            <div class="tt-404-content">
                <span class="tt-404-label"><span></span> ERROR 404</span>
                <h1>Oops! Page Not Found</h1>
                <p>The page you're looking for may have been moved, removed, or is temporarily unavailable. Let's get
                    you back on track.</p>
            </div>
            <!--- Action Buttons --->
            <div class="tt-404-actions">
                <button type="button" class="tt-404-back-btn" id="tt404GoBack">
                    <i class="bi bi-arrow-left"></i>
                    <span>Go Back</span>
                </button>
                <a href="index.html" class="tt-404-home-btn">
                    <span>Back to Home</span>
                    <i class="bi bi-arrow-up-right"></i>
                </a>
            </div>
            <!--- Support Text --->
            <div class="tt-404-support">
                <i class="bi bi-shield-check"></i>
                <span>We're here to make your healthcare journey easier.</span>
            </div>
        </div>
        <!--- Footer --->
        <div class="tt-404-footer">
            <span>&copy; <span id="tt404Year"></span> Stackly. All rights reserved.</span>
        </div>
    </main>
    <!--- End 404 Page --->
    <script src="assets/js/404.js"></script>
</body>

</html>
